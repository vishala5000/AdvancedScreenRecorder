name: Build Windows App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore ScreenRecorderApp.csproj

    - name: Build the Application
      run: msbuild ScreenRecorderApp.csproj /p:Configuration=Release /p:DeployOnBuild=false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: V-Rec-Windows-EXE
        path: bin/Release/net48/V Rec.exe

name: Build Windows App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download FFmpeg
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
        $ffmpegExe = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Copy-Item $ffmpegExe.FullName -Destination "ffmpeg.exe"
        Remove-Item "ffmpeg.zip" -Force
        Remove-Item "ffmpeg_temp" -Recurse -Force

    - name: Convert PNG to ICO (if icon.png exists)
      if: hashFiles('icon.png') != ''
      run: |
        # Try ImageMagick first
        if (Get-Command magick -ErrorAction SilentlyContinue) {
          magick convert icon.png -define icon:auto-resize=256,128,64,48,32,16 icon.ico
          Write-Host "Icon converted with ImageMagick"
        } else {
          # Fallback: Use FFmpeg to create a simple ICO
          ffmpeg -i icon.png -vf "scale=256:256" -y icon.ico
          Write-Host "Icon converted with FFmpeg"
        }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore ScreenRecorderApp.csproj

    - name: Build the Application
      run: msbuild ScreenRecorderApp.csproj /p:Configuration=Release /p:DeployOnBuild=false

    - name: Create Portable ZIP
      run: Compress-Archive -Path "bin\Release\net48\*" -DestinationPath "VRec_Portable.zip"

    - name: Compile Inno Setup Installer
      run: |
        New-Item -ItemType Directory -Force -Path Output
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: V-Rec-Final-Releases
        path: |
          VRec_Portable.zip
          Output/VRec_Setup.exe

name: Build Windows App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore ScreenRecorderApp.csproj

    - name: Build the Application
      run: msbuild ScreenRecorderApp.csproj /p:Configuration=Release /p:DeployOnBuild=false

    - name: Create Portable ZIP
      run: Compress-Archive -Path "bin\Release\net48\*" -DestinationPath "VRec_Portable.zip"

    - name: Compile Inno Setup Installer
      run: |
        New-Item -ItemType Directory -Force -Path Output
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: V-Rec-Final-Releases
        path: |
          VRec_Portable.zip
          Output/VRec_Setup.exe
